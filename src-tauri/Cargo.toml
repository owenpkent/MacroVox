[package]
name = "macrovox"
version = "1.0.6"
edition = "2021"
description = "MacroVox — Voice Dictation for Windows"
authors = ["OK Studio"]
license = "MIT"

[package.metadata.bundle]
identifier = "com.okstudio.macrovox"
icon = ["icons/icon.ico", "icons/icon.png"]

[lib]
name = "macrovox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 3: native WASAPI audio capture (replaces ffmpeg subprocess)
cpal = "0.15"
# HTTP client for Deepgram pre-recorded API in recording_stop
reqwest = { version = "0.12", features = ["json"] }

# Phase 4: Deepgram WebSocket streaming (pre-warmed real-time STT)
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "macros", "rt"] }

# Phase 4: local STT option (off by default — requires cmake + model download)
# Enable with: cargo build --features local-stt
whisper-rs = { version = "0.10", optional = true }

# Phase 5: replace PowerShell SendKeys paste (~700ms) with native input
# enigo = "0.2"

[features]
default = []
local-stt = ["dep:whisper-rs"]
